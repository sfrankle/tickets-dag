[project]
name = "ticket"
version = "0.1.0"
description = "Config-driven DAG for driving a Jira ticket to a merged PR"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ticket = "ticket.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
