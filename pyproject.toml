[project]
name = "ticket"
version = "0.1.0"
description = "Config-driven DAG for driving a Jira ticket to a merged PR"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ticket = "ticket.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Pinned explicitly so a ruff bump cannot silently widen or narrow the gate.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PLW", "EXE"]
